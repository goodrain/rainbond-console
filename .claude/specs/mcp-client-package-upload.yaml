            description: "Implement normalized exact-origin URL checks, strict upload contract validation, and safe curl form encoding."
            code: |
              def normalized_origin(value, label):
                  parsed = urlsplit(value)
                  if parsed.scheme.lower() not in ("http", "https") or not parsed.netloc or not parsed.hostname:
                      raise HelperError("{} must be an HTTP(S) URL".format(label))
                  if parsed.username is not None or parsed.password is not None:
                      raise HelperError("{} must not contain user information".format(label))
                  try:
                      port = parsed.port
                  except ValueError as error:
                      raise HelperError("{} has an invalid port: {}".format(label, error))
                  effective_port = port or (443 if parsed.scheme.lower() == "https" else 80)
                  return parsed.scheme.lower(), parsed.hostname.lower(), effective_port

              def resolve_upload_url(base_value, upload_value):
                  base_origin = normalized_origin(base_value, "RAINBOND_URL")
                  resolved = urljoin(base_value.rstrip("/") + "/", upload_value)
                  if normalized_origin(resolved, "upload URL") != base_origin:
                      raise HelperError("upload URL must use the same Console origin as RAINBOND_URL")
                  parsed = urlsplit(resolved)
                  if parsed.fragment:
                      raise HelperError("upload URL must not contain a fragment")
                  return urlunsplit(parsed)

              def validate_upload_contract(args):
                  if args.url_scope != "console_origin":
                      raise HelperError("url scope must be console_origin")
                  if args.method.upper() != "POST":
                      raise HelperError("upload method must be POST")
                  if args.content_type.lower() != "multipart/form-data":
                      raise HelperError("content type must be multipart/form-data")
                  if args.authorization.lower() != "none":
                      raise HelperError("upload authorization must be none")
                  if not FIELD_NAME_RE.fullmatch(args.file_field):
                      raise HelperError("file field contains unsupported characters")

              def curl_file_form(field, archive):
                  escaped = str(archive).replace("\\", "\\\\").replace('"', '\\"')
                  return '{}=@"{}"'.format(field, escaped)
            run: "python3 tests/package_upload_helper_test.py"
            expect: "Still FAIL because curl execution is not wired"
          - action: implement
            description: "Implement streaming curl execution with bounded timeout, captured output, non-2xx handling, and no credentials."
            code: |
              def upload_package(args):
                  validate_upload_contract(args)
                  archive_arg = resolve_argument_path(args.archive)
                  if archive_arg.is_symlink():
                      raise HelperError("archive must not be a symbolic link")
                  try:
                      archive = archive_arg.resolve(strict=True)
                  except FileNotFoundError:
                      raise HelperError("archive does not exist: {}".format(archive_arg))
                  if not archive.is_file():
                      raise HelperError("archive must be a file")
                  require_supported_suffix(archive.name)
                  target = resolve_upload_url(os.environ.get("RAINBOND_URL", ""), args.upload_url)
                  command = [
                      "curl", "--fail-with-body", "--silent", "--show-error",
                      "--max-time", str(args.timeout), "--request", "POST",
                      "--form", curl_file_form(args.file_field, archive), target,
                  ]
                  try:
                      result = subprocess.run(
                          command, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                          text=True, timeout=args.timeout + 5,
                      )
                  except FileNotFoundError:
                      raise HelperError("curl executable was not found")
                  except subprocess.TimeoutExpired:
                      raise HelperError("package upload timed out")
                  if result.returncode:
                      detail = result.stderr.strip()[:512] or "no curl error details"
                      raise HelperError("package upload failed (curl {}): {}".format(result.returncode, detail))
                  return {"uploaded": True}
