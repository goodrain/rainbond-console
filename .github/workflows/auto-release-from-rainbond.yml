name: Auto release from rainbond

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v6.7.2-release
        required: true
        type: string
      rainbond_release_url:
        description: Rainbond release URL
        required: true
        type: string
      target:
        description: Commit to tag (pinned by rainbond's release workflow). Empty = current main
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: auto-release-from-rainbond-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists, skip."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # rainbond's release workflow pins the commit it tested; tag exactly that
      # commit instead of whatever main points to when this run starts.
      - name: Resolve target commit
        id: target
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          if [ -z "$TARGET" ]; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "No target given, tagging $GITHUB_REF_NAME"
            exit 0
          fi

          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target must be a full 40-character commit SHA, got '$TARGET'"
            exit 1
          fi

          if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/${TARGET}...${GITHUB_REF_NAME}" --jq .status 2>/dev/null); then
            status=unknown-commit
          fi
          case "$status" in
            identical|ahead) ;;
            *)
              echo "::error::$TARGET is not on $GITHUB_REF_NAME (compare status: $status)"
              exit 1
              ;;
          esac

          echo "ref=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Tagging pinned commit $TARGET"

      - name: Find previous release tag
        id: previous
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          PREV_TAG=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 20 \
            --json tagName \
            --jq '[.[].tagName | select(. != env.TAG)][0] // ""')

          echo "tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV_TAG"

      - name: Create release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PREV_TAG: ${{ steps.previous.outputs.tag }}
          RAINBOND_RELEASE_URL: ${{ inputs.rainbond_release_url }}
          TARGET_REF: ${{ steps.target.outputs.ref }}
        run: |
          set -euo pipefail

          printf -v NOTES 'Update reference: %s\n\n' "$RAINBOND_RELEASE_URL"

          if [ -n "$PREV_TAG" ]; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              --notes "$NOTES" \
              --target "$TARGET_REF"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes \
              --notes "$NOTES" \
              --target "$TARGET_REF"
          fi
